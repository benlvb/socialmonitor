name: Bug report
description: Something behaves differently from what the docs or SPEC say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For anything security-related, do **not** open an issue — see
        [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        Steps, and whether it reproduces in `FIXTURE_MODE=1` (which needs no
        credentials). A fixture-mode repro is the fastest path to a fix.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pipeline worker (queue, cursors, breakers)
        - Source adapter (X / Reddit / YouTube / Telegram / Discord)
        - Classifier / themes
        - Web app (dashboard, monitors, connections)
        - /ask or weekly summaries
        - Database / migrations / RLS
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: events
    attributes:
      label: Relevant pipeline_events / logs
      description: |
        Event `kind` and message if there is one (`coverage_gap`,
        `breaker_tripped`, `mass_failure`…), plus worker logs. Redact any
        credentials before pasting.
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
